[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/7uk0/Caput-Mortuum"

[workspace.dependencies]
bevy = { version = "0.20.0", default-features = false }
bevy_ecs = "0.20.0"
bevy_app = "0.20.0"
bevy_math = "0.20.0"
yaml_serde = "0.10.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = "2"
base64 = "0.22"
thiserror = "2"
tracing = "0.1"
walkdir = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
